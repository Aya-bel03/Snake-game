<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Snake Game</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.9.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.9.1/core.js"></script>

    <style>
        body {
            background-color: #0f140a;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px 10px;
            -webkit-user-select: none;
            user-select: none;
        }
        h1 { font-size: 1.6rem; margin: 0 0 8px; }
        p  { margin: 4px 0 10px; font-size: 0.9rem; color: #b9d8a8; }

        #canvas {
            border: 2px solid #50c850;
            max-width: 100%;
            height: auto;
            touch-action: none;   /* empêche le scroll pendant le swipe */
        }

        /* Boutons fléchés : visibles seulement sur écran tactile */
        #pad {
            display: none;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(3, 70px);
            gap: 8px;
            justify-content: center;
            margin: 16px auto 0;
        }
        #pad button {
            font-size: 1.6rem;
            border: 2px solid #50c850;
            border-radius: 14px;
            background: #1b2a12;
            color: #c8ffb4;
            touch-action: manipulation;
        }
        #pad button:active { background: #2f4a1f; }
        #btn-up    { grid-column: 2; grid-row: 1; }
        #btn-left  { grid-column: 1; grid-row: 2; }
        #btn-ok    { grid-column: 2; grid-row: 2; font-size: 1rem !important; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down  { grid-column: 2; grid-row: 3; }

        @media (pointer: coarse) {
            #pad { display: grid; }
        }
    </style>
</head>
<body>
    <h1>Snake Game</h1>
    <p>Le chargement prend 10 à 30 secondes... </p>

    <canvas id="canvas" width="600" height="400"></canvas>

    <div id="pad">
        <button id="btn-up">▲</button>
        <button id="btn-left">◀</button>
        <button id="btn-ok">OK</button>
        <button id="btn-right">▶</button>
        <button id="btn-down">▼</button>
    </div>

    <script type="py" src="./main.py" config='{"packages": ["pygame-ce"]}'></script>
</body>
</html>

<!DOCTYPE html>
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title> Snake Game </title>
    
    <!-- Styles CSS et scripts PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.9.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.9.1/core.js"></script>
    
    <style>
        body {
            background-color: #0f140a;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 30px;
        }
        /* Définition de la zone d'affichage du jeu dans le navigateur */
        #game-canvas {
            margin-top: 20px;
            border: 2px solid #50c850;
        }
    </style>
</head>
<body>
    <h1> Welcome to Snake Game </h1>
    
    <!-- Zone d'affichage des graphismes Pygame -->
    <canvas id="game-canvas" width="600" height="400"></canvas>

    <!-- Configuration PyScript pour installer les paquets nécessaires -->
    <script type="py" config='{"packages": ["pygame-ce", "numpy"]}'>
        import micropip
        await micropip.install(["pygame-ce", "numpy"])
    </script>

    <!-- Exécution du fichier Python principal -->
    <script type="py" src="./main.py"></script>
</body>
</html>
